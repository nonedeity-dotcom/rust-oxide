<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1210">
<title>Xust</title>
<style>
:root{--bg:#0d1210;--panel:#151c18ee;--line:#2c3a33;--ink:#e9efe6;--dim:#8fa396;--amber:#f0b45a;--bad:#e5735a;--s:clamp(40px,11vh,56px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:600 14px/1.25 "Trebuchet MS",system-ui,sans-serif}
#zone,#hud,canvas{touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#zone{position:fixed;inset:0}
#hud{position:fixed;inset:0;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#hud::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,#00000055 100%);pointer-events:none}
#cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff;opacity:.75;box-shadow:0 0 0 1.5px #0007}
#hint{position:absolute;left:50%;top:56%;transform:translateX(-50%);padding:4px 10px;border-radius:6px;background:#0009;font-size:13px;opacity:0;transition:opacity .12s;white-space:nowrap}
#hint.on{opacity:1}
#toast{position:absolute;left:50%;top:14%;transform:translateX(-50%);padding:6px 14px;border-radius:8px;background:#0b0f0dd0;border:1px solid var(--line);color:var(--amber);opacity:0;transition:opacity .25s;white-space:nowrap}
#toast.on{opacity:1}
#clock{position:absolute;left:12px;top:10px;padding:3px 9px;border-radius:6px;background:#0007;color:var(--dim);font-size:12px;pointer-events:auto}
#vit{position:absolute;left:12px;top:38px;display:flex;align-items:center;gap:6px}
#hpbar{width:120px;height:12px;border-radius:7px;background:#0009;border:1.5px solid #ffffff55;overflow:hidden}
#hpbar i{display:block;height:100%;width:100%;background:linear-gradient(#e85b4a,#c23a2c);transition:width .15s}
#hpbar.low i{background:#ff2b1c;animation:blink .6s infinite alternate}
@keyframes blink{to{opacity:.55}}
#hpn{font-size:12px;text-shadow:0 1px 2px #000}
#armor{font-size:16px}
#hurt{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 35%,#d01e0fcc 100%)}
#hurt.on{animation:hurt .55s ease-out}
@keyframes hurt{from{opacity:1}to{opacity:0}}
#hotbar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:5px;pointer-events:auto}
.slot{position:relative;width:var(--s);height:var(--s);border-radius:8px;background:#0b100dcc;border:2px solid var(--line);display:grid;place-items:center;font-size:calc(var(--s)*.5)}
.slot.sel{border-color:var(--amber);box-shadow:0 0 0 2px #f0b45a55}
.slot.swp{border-color:#7fd1ff;box-shadow:0 0 0 2px #7fd1ff66}
.slot b{position:absolute;right:3px;bottom:1px;font-size:11px;text-shadow:0 1px 2px #000}
.slot i{position:absolute;left:4px;top:1px;font:600 10px sans-serif;color:var(--dim)}
.btn{position:absolute;pointer-events:auto;touch-action:none;transform:scale(var(--bs,1));transform-origin:bottom right;display:grid;place-items:center;border-radius:50%;background:#0b100dbb;border:2px solid #ffffff44;font-size:26px;color:#fff}
.btn:active,.btn.on{background:#f0b45a55;border-color:var(--amber)}
#bHit{right:22px;bottom:78px;width:84px;height:84px;font-size:34px}
#bJump{right:120px;bottom:24px;width:62px;height:62px}
#bCrouch{right:206px;bottom:30px;width:52px;height:52px;font-size:22px}
#bInv,#bMenu{top:10px;width:48px;height:48px;font-size:22px;transform-origin:top right}
#bInv{right:12px}
#bMenu{right:68px}
#stick{position:absolute;width:110px;height:110px;margin:-55px;border-radius:50%;border:2px solid #ffffff55;background:#ffffff14;display:none}
#stick.fixed{display:block!important;left:135px!important;top:calc(100% - 115px)!important;opacity:.6}
#stick i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:#ffffff77}
#panel{position:fixed;inset:0;display:none;place-items:center;background:#000a;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom);touch-action:pan-y}
#panel.on{display:grid}
.card{display:flex;gap:16px;max-width:96vw;max-height:94vh;overflow:auto;padding:14px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.card h3{margin:0 0 8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
.grid{display:grid;grid-template-columns:repeat(6,var(--s));gap:5px}
.col{min-width:200px}
.rec{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:6px;padding:6px 8px;border-radius:8px;background:#0b100d;border:1px solid var(--line)}
.rec small{display:block;color:var(--dim);font-weight:500}
.rec .no{color:var(--bad)}
.act{padding:7px 12px;border:0;border-radius:8px;background:var(--amber);color:#1b1306;font:700 13px inherit;font-family:inherit}
.act[disabled]{background:#2c3a33;color:#6d8074}
.x{align-self:flex-start;border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit}
.menu .col{display:flex;flex-direction:column;gap:9px;min-width:230px}
.big{padding:12px 16px;font-size:16px;text-align:left}
.danger{background:#e5735a;color:#240a05}
.act.off{background:#2c3a33;color:#9db0a3}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 8px;margin-bottom:8px;font-size:13px}
.row b{color:var(--amber);font-size:12px}
.row input[type=range]{grid-column:1/3;width:100%;accent-color:var(--amber);height:24px;margin:0}
.sett .col{min-width:210px;max-width:290px}
.help{display:block;color:var(--dim);font-weight:500;line-height:1.4}
#death{position:fixed;inset:0;display:none;place-items:center;background:#5a0a06cc;color:#fff;font-size:30px;letter-spacing:.12em;z-index:8}
#death.on{display:grid}
#load{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);color:var(--amber);font-size:18px;letter-spacing:.1em;z-index:9}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="zone"></div>
<div id="hud">
  <div id="clock"></div><div id="vit"><div id="hpbar"><i></i></div><b id="hpn"></b><span id="armor"></span></div><div id="hurt"></div><div id="cross"></div><div id="hint"></div><div id="toast"></div>
  <div id="stick"><i></i></div>
  <div id="hotbar"></div>
  <div class="btn" id="bHit">⛏️</div><div class="btn" id="bJump">⤒</div><div class="btn" id="bCrouch">⤓</div><div class="btn" id="bMenu">☰</div><div class="btn" id="bInv">🎒</div>
</div>
<div id="panel"></div>
<div id="death">ВЫ ПОГИБЛИ</div>
<div id="load">XUST · ОСТРОВ ГЕНЕРИРУЕТСЯ…</div>
<script type="module" src="/js/main.js"></script>
</body>
</html>
